name: Verify

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run media
      - run: npm run lint
      # Builds the static export, then checks heading order, alt text, control
      # names, ids, fragment targets, internal links, canonical tags, design
      # tokens, marketing language, and 120 contrast pairs.
      - run: npm run verify
