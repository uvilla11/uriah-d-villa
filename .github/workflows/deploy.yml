name: Deploy

# Publishes the static export to GitHub Pages. Deploys only from main — work
# on build/** branches is verified by verify.yml but never published — plus
# manual dispatch for re-runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run media
      - run: npm run lint
      # Full gates before anything is published: static build, structural
      # accessibility and content checks, and token contrast ratios.
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
